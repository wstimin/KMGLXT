<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>十夜卡密</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M12 2l2.4 5.1 5.6.8-4 4 1 5.4L12 14.9 7 17.3l1-5.4-4-4 5.6-.8z'/%3E%3C/svg%3E"
    />
    <style>
      .boot-screen{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#eef8ff,#f3efff);opacity:0;animation:boot-show .16s ease .12s forwards}
      .boot-mark{display:grid;width:46px;height:46px;place-items:center;border-radius:15px;color:#fff;background:linear-gradient(135deg,#22d3ee,#4f7cff 55%,#8b5cf6);box-shadow:0 10px 30px rgba(79,124,255,.26);font:700 20px/1 system-ui;animation:boot-pulse 1.1s ease-in-out infinite alternate}
      @keyframes boot-show{to{opacity:1}}
      @keyframes boot-pulse{to{transform:translateY(-3px);box-shadow:0 14px 34px rgba(79,124,255,.34)}}
      @media(prefers-reduced-motion:reduce){.boot-screen{opacity:1;animation:none}.boot-mark{animation:none}}
    </style>
  </head>
  <body>
    <div id="app"><div class="boot-screen" role="status" aria-label="正在加载"><span class="boot-mark">✦</span></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
