# ─────────────────────────────────────────────
# 十夜卡密 · GitHub Actions 自动构建
# push 到 main 自动: 构建前端 → 打包 tar.gz → 发布 Release
# ─────────────────────────────────────────────
name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare release metadata
        run: |
          # 33f2048 是 1.0.0 基线；main 此后的每个提交自动增加补丁版本。
          BASE_COMMIT="33f2048"
          PATCH="$(git rev-list --count "${BASE_COMMIT}..HEAD")"
          VERSION="1.0.${PATCH}"
          TAG="v${VERSION}"
          ARCHIVE="KMGLXT-${TAG}.tar.gz"
          PANEL_ARCHIVE="KMGLXT-${TAG}-panel.tar.gz"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "PANEL_ARCHIVE=${PANEL_ARCHIVE}" >> "$GITHUB_ENV"
          echo "${TAG}" > .km-version
          npm pkg set "version=${VERSION}"
          npm pkg set "version=${VERSION}" --prefix server
          npm pkg set "version=${VERSION}" --prefix web

      # 安装依赖
      - name: Install dependencies
        run: |
          cd server && npm install --no-fund --no-audit && cd ..
          cd web    && npm install --no-fund --no-audit && cd ..

      # 构建前端（产物输出到 server/public）
      - name: Build frontend
        run: npm run build

      # 打包构建包（排除 node_modules 与数据库）
      - name: Package build
        run: |
          tar -czf "${ARCHIVE}" \
            --exclude='server/node_modules' \
            --exclude='web/node_modules' \
            --exclude='server/data' \
            --exclude='web/dist' \
            --exclude='.git' \
            --exclude='.claude' \
            --exclude='方案.md' \
            --exclude='规划书.md' \
            server/ web/ deploy/ docs/ package.json README.md .gitignore \
            .km-version Dockerfile compose.yaml .dockerignore

          echo "--- 包内容 ---"
          tar -tzf "${ARCHIVE}" | head -30
          echo "--- 总文件数 ---"
          tar -tzf "${ARCHIVE}" | wc -l
          echo "--- 包大小 ---"
          du -h "${ARCHIVE}"

      # 宝塔 / 1Panel 专用包：包含生产依赖，上传解压后可直接创建 Node 项目。
      - name: Package panel build
        run: |
          rm -rf web/node_modules
          tar -czf "${PANEL_ARCHIVE}" \
            --exclude='server/data' \
            --exclude='web/dist' \
            --exclude='.git' \
            --exclude='.claude' \
            --exclude='方案.md' \
            --exclude='规划书.md' \
            server/ web/ deploy/ docs/ package.json README.md .gitignore .km-version
          du -h "${PANEL_ARCHIVE}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ env.TAG }}
          tags: |
            ghcr.io/wstimin/kmglxt:latest
            ghcr.io/wstimin/kmglxt:${{ env.TAG }}

      # 发布 Release（含构建包资产）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "正式版 ${{ env.TAG }}"
          body: |
            🔄 **自动构建产物**

            - 包含前端构建好的静态文件（`server/public/`）
            - 部署脚本（`deploy/build.sh`、`deploy/km.sh`）
            - `KMGLXT-*-panel.tar.gz` 为宝塔 / 1Panel 专用包，已包含生产依赖
            - 面板创建 Node 项目并绑定域名后，首次访问自动进入网页安装向导
            - 对接文档（`docs/对接文档.md`、SDK 示例）
            - 所有安装包均不包含数据库数据（`server/data`）

            **服务器部署步骤：**
            ```bash
            # 下载解压到 /opt/kmglxt
            wget <下载地址>
            tar -xzf KMGLXT-v*.tar.gz -C /opt/kmglxt
            cd /opt/kmglxt && bash deploy/build.sh
            systemctl restart kmglxt
            ```

            **Docker 镜像：** `ghcr.io/wstimin/kmglxt:${{ env.TAG }}`
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.PANEL_ARCHIVE }}
          draft: false
          prerelease: false
          generate_release_notes: true
